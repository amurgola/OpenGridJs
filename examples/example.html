<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenGrid Example</title>
    <link rel="stylesheet" href="../opengrid.min.css">
    <script src="../opengrid.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 24px;
        }
        .dataGrid {
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenGrid Examples</h1>

        <h2>Simple Example (No Setup Required)</h2>
        <div class="simpleGrid" style="margin-bottom: 40px;"></div>

        <h2>Advanced Example (With Custom Setup)</h2>
        <div class="dataGrid" style="margin-bottom: 40px;"></div>

        <h2>Dynamic Row Heights (Lorem Ipsum of Varying Length)</h2>
        <p style="color:#6b7280; margin-top:0;">
            Rows grow to fit the tallest text cell. <code>gridRowPxSize</code>
            still acts as the minimum floor, so short rows stay compact.
        </p>
        <div class="dynamicGrid"></div>
    </div>
<script>
    // Simple example with minimal setup
    const simpleData = [
        { id: 1, name: "John Doe", email: "john@example.com", age: 30 },
        { id: 2, name: "Jane Smith", email: "jane@example.com", age: 25 },
        { id: 3, name: "Bob Johnson", email: "bob@example.com", age: 35 }
    ];

    // Initialize simple grid (no setup object required)
    const simpleGrid = new OpenGrid("simpleGrid", simpleData, 200);

    // Advanced example with custom setup
    const setup = {
        columnHeaderNames: [
            {
                columnName: "name",
                columnNameDisplay: "Full Name",
            },
            { columnName: "phoneNumber" },
            {
                columnName: "email",
                columnNameDisplay: "Email",
                format: function (value) {
                    return "<a href='mailto:" + value + "'>" + value + "</a>";
                },
            },
        ],
        contextMenuTitle: "Context Title",
        contextMenuOptions: [
            {
                actionName: "Example",
                actionFunctionName: "exampleRow",
                className: "example-row",
            },
        ],
    };

    async function loadDemoData() {
        return fetch("https://lumabyte.com/api/generateMockRandomPeople?count=100")
            .then((response) => response.json());
    }
    async function loadMoreDemoData() {
        loadDemoData()
            .then((jsonData) => grid.appendData(jsonData))
    }

    var grid = new OpenGrid("dataGrid", loadDemoData, 350, setup, loadMoreDemoData);

    function exampleRow(row) {
        alert("Example row " + row.email);
    }

    // Dynamic row height example — Lorem ipsum of varying length per row.
    // Every row's text gets wrapped into the available column width and the
    // row grows to fit the tallest cell. Short cells stay at gridRowPxSize.
    const loremSnippets = [
        "Lorem ipsum.",
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit.",
        "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
        "Duis aute irure.",
        "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam varius, turpis et commodo pharetra, est eros bibendum elit, nec luctus magna felis sollicitudin mauris.",
        "Integer in mauris eu nibh euismod gravida.",
        "Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae; Praesent blandit, nunc a ullamcorper viverra, turpis ligula luctus purus, at gravida purus arcu vitae risus. Nullam luctus, mi vitae luctus faucibus, nisl quam luctus lectus, et mattis mi nunc vel lectus.",
        "Short one.",
        "Proin quam nisl, tincidunt et, mattis eget, convallis nec, purus. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus.",
        "Nulla facilisi. Integer lacinia sollicitudin massa."
    ];

    const titles = [
        "Getting Started",
        "Design Guidelines",
        "Release Notes",
        "FAQ",
        "Roadmap",
        "Troubleshooting",
        "Architecture Overview",
        "Tips",
        "Changelog",
        "Contact"
    ];

    const dynamicData = loremSnippets.map((text, i) => ({
        id: i + 1,
        title: titles[i],
        description: text,
        wordCount: text.split(/\s+/).filter(Boolean).length
    }));

    const dynamicSetup = {
        dynamicRowHeight: true, // opt-in
        rowPadding: 12,         // vertical padding per cell
        columnHeaderNames: [
            { columnName: "title", columnNameDisplay: "Title", columnWidth: "180px", autoresize: false },
            { columnName: "description", columnNameDisplay: "Description" },
            { columnName: "wordCount", columnNameDisplay: "Words", columnWidth: "90px", autoresize: false }
        ]
    };

    const dynamicGrid = new OpenGrid("dynamicGrid", dynamicData, 500, dynamicSetup);
    </script>
    </div>
</body>
</html>
